variables:

  TEST_DATA_DIR: $CI_PROJECT_DIR/testFGData
  BUNDLED_DATA_DIR: $CI_PROJECT_DIR/bundledFGData

# minimal data for running FGTestSuite, keep this as small as possible
# since we frequently copy it to the code builders
create-test-data:
  stage: deploy

  script:
    - mkdir $TEST_DATA_DIR
    - cp *.xml $TEST_DATA_DIR
    - cp version $TEST_DATA_DIR

    - mkdir -p $TEST_DATA_DIR/AI/Aircraft
    - cp AI/Aircraft/*.xml $TEST_DATA_DIR/AI/Aircraft/
    - cp AI/*.xml $TEST_DATA_DIR/AI/

    - mkdir -p $TEST_DATA_DIR/ATC/
    - cp ATC/*.xml $TEST_DATA_DIR/ATC/

    - cp -r Environment Nasal Timezone Navaids Airports Input gui $TEST_DATA_DIR

  artifacts:
    paths:
      - $TEST_DATA_DIR

validate-shaders:
  stage: test
  image: registry.gitlab.com/flightgear/flightgear
  allow_failure: true
  before_script:
    # grab the script from FGMeta
    # note we don't clone submodules so this is tiny
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/flightgear/fgmeta
    - ls
  script:
    - export PYTHONPATH="$CI_PROJECT_DIR/fgmeta/python3-flightgear" 
    - ./fgmeta/fg-validate-shaders $CI_PROJECT_DIR

